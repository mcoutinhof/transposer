<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transposer</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 26rem; margin: 4rem auto; padding: 0 1rem; display: grid; gap: 1rem; }
  h1 { text-align: center; margin: 0; }
  #area { display: block; border: 2px dashed #999; border-radius: 8px; padding: 2rem 1rem; text-align: center; cursor: pointer; }
  #area.arrastando { border-color: #06c; background: #eef6ff; }
  #area:focus-within { border-color: #06c; outline: 2px solid #06c; outline-offset: 2px; }
  /* input escondido visualmente mas ainda focável por teclado (Tab → Enter abre o seletor) */
  #arquivo { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
  #tom { display: flex; gap: 0.75rem; align-items: center; justify-content: center; }
  #tom button { width: 2.8rem; height: 2.8rem; padding: 0; font-size: 1.5rem; border-radius: 50%; }
  #valor { min-width: 12rem; text-align: center; font-size: 1.2rem; font-weight: 600; }
  #valor.original { color: #767676; font-weight: normal; }
  #transpor { justify-self: center; font-size: 1.1rem; padding: 0.5rem 2rem; }
  #rotulo { pointer-events: none; } /* sem isso, passar sobre o texto dispara dragleave e a borda pisca */
  #status { min-height: 1.5rem; text-align: center; margin: 0; }
  #status.erro { color: #b00020; }
</style>
</head>
<body>
  <h1>Transposer</h1>
  <label id="area" for="arquivo">
    <input type="file" id="arquivo" accept="application/pdf,.pdf">
    <span id="rotulo">Arraste um PDF de cifra aqui ou clique para escolher</span>
  </label>
  <div id="tom">
    <button id="abaixar" aria-label="Abaixar meio tom">−</button>
    <span id="valor" class="original" aria-live="polite">Tom original</span>
    <button id="subir" aria-label="Subir meio tom">+</button>
  </div>
  <button id="transpor" disabled>Transpor</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./app.js"></script>
</body>
</html>
