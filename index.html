<style>
  /* Coluna da altura da tela: o rodapé fica no fim dela, não colado no botão. */
  body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 0 auto; padding: 1.25rem 1rem 0; box-sizing: border-box; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; color: #1a1a1a; }
  @media (min-height: 700px) and (min-width: 600px) { body { padding-top: 3rem; } }
  /* Computador: a página inteira um pouco maior e mais para o meio da tela. */
  @media (min-height: 700px) and (min-width: 1000px) { html { font-size: 125%; } body { padding-top: 12vh; } }
  main { flex: 1 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 1rem; padding-bottom: 2rem; }
  footer { text-align: center; font-size: 0.85rem; color: #555; padding: 1rem 0 calc(1rem + env(safe-area-inset-bottom)); }
  footer a { color: #1759ef; }
  h1 img { width: 1.75rem; height: 1.75rem; }
  h1 { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin: 0; font-size: 1rem; color: #1759ef; }
  #area { position: relative; display: grid; place-content: center; justify-items: center; gap: 0.15rem; min-height: 6.5rem; box-sizing: border-box; border: 2px dashed #767676; border-radius: 12px; padding: 0.75rem 1rem; text-align: center; cursor: pointer; }
  #area.arrastando { border-color: #1759ef; background: #eaf1ff; }
  #area.escolhido { border-style: solid; border-color: #1759ef; background: #f4f7ff; }
  #area:focus-within { border-color: #1759ef; outline: 2px solid #1759ef; outline-offset: 2px; }
  /* O campo cobre a área inteira, invisível: o toque (e o "explorar pelo toque" do leitor de tela) cai nele. */
  #arquivo { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; cursor: pointer; font-size: 0; }
  #rotulo { pointer-events: none; display: contents; }
  #rotulo svg { width: 2rem; height: 2rem; color: #1759ef; margin-bottom: 0.2rem; }
  #area.escolhido .ic-escolher, #area:not(.escolhido) .ic-escolhido { display: none; }
  #rotulo-texto { font-weight: 600; color: #1759ef; overflow-wrap: anywhere; }
  .dica { font-size: 0.9rem; color: #555; }
  .dica-arraste { display: none; }
  @media (hover: hover) and (pointer: fine) { #area:not(.escolhido) .dica-arraste { display: inline; } }
  .dica-trocar { display: none; text-decoration: underline; }
  #area.escolhido .dica-trocar { display: inline; }
  button, #area { -webkit-tap-highlight-color: transparent; }
  button { font: inherit; cursor: pointer; }
  button:active { filter: brightness(0.9); }
  #tom { display: flex; gap: 0.75rem; align-items: start; justify-content: center; }
  .lado { display: grid; justify-items: center; gap: 0.15rem; font-size: 0.8rem; color: #555; }
  #tom button { width: 2.8rem; height: 2.8rem; padding: 0; font-size: 1.5rem; line-height: 1; border-radius: 50%; background: #fff; color: #1759ef; border: 2px solid #1759ef; }
  /* aria-disabled (não disabled): o botão continua focável, e o foco de quem usa teclado não se perde */
  #tom button[aria-disabled="true"] { color: #b0b0b0; border-color: #d0d0d0; cursor: default; }
  #valor { display: flex; align-items: center; justify-content: center; min-height: 2.8rem; width: 12rem; max-width: calc(100% - 8.2rem); text-wrap: balance; text-align: center; font-size: 1.2rem; font-weight: 600; }
  #valor.original { font-weight: normal; }
  @media (max-width: 340px) { #valor { font-size: 1.05rem; } }
  /* Mesma largura nos dois botões grandes, e o "Mudando… 3 de 4" não alarga o botão. */
  #transpor, #compartilhar { min-width: 14rem; font-variant-numeric: tabular-nums; }
  #transpor { justify-self: center; font-size: 1.1rem; font-weight: 600; padding: 0.75rem 1.5rem; border: 0; border-radius: 999px; background: #1759ef; color: #fff; }
  #transpor[aria-busy="true"] { cursor: progress; }
  #transpor[aria-disabled="true"] { background: #dfe6f7; color: #6b7896; cursor: default; }
  button[aria-disabled="true"]:active { filter: none; }
  /* Depois de pronto, o próximo passo é compartilhar: ele fica em destaque, e "Mudar o tom" só com contorno. */
  #transpor.feito { background: #fff; color: #1759ef; box-shadow: inset 0 0 0 2px #1759ef; }
  /* Abaixo do resultado não há nada: o que aparece nele não empurra a página. */
  #resultado { display: grid; }
  #status { text-align: center; text-wrap: balance; margin: 0; overflow-wrap: anywhere; }
  #status.erro { color: #b00020; }
  #status.com-texto + #compartilhar { margin-top: 0.6rem; }
  #compartilhar { justify-self: center; font-size: 1.1rem; font-weight: 600; padding: 0.75rem 1.5rem; border: 0; border-radius: 999px; background: #1759ef; color: #fff; }
  #compartilhar[hidden] { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>

<body>
<main>
  <h1><img src="icone.svg" width="28" height="28" alt="">Transposer<span class="sr"> mudar o tom da cifra em PDF</span></h1>
  <label id="area" for="arquivo">
    <input type="file" id="arquivo" accept="application/pdf,.pdf" aria-label="Escolher o PDF da cifra">
    <span id="rotulo" aria-hidden="true">
      <svg class="ic-escolher" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-6m-3 3 3-3 3 3"/></svg>
      <svg class="ic-escolhido" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m8.5 14.5 2.5 2.5 4.5-5"/></svg>
      <span id="rotulo-texto">Escolher o PDF da cifra</span>
      <span class="dica dica-arraste">ou arraste até aqui</span>
      <span class="dica dica-trocar">trocar de arquivo</span>
    </span>
  </label>
  <div id="tom" role="group" aria-label="Tom">
    <span class="lado"><button id="abaixar" aria-label="Abaixar meio tom">−</button><span aria-hidden="true">abaixar</span></span>
    <span id="valor" class="original"><span class="sr">Mudança: </span><span id="valor-texto">Tom original</span></span>
    <span class="lado"><button id="subir" aria-label="Subir meio tom">+</button><span aria-hidden="true">subir</span></span>
  </div>
  <button id="transpor" aria-disabled="true">Mudar o tom</button>
  <div id="resultado">
    <p id="status" role="status" aria-live="polite"></p>
    <button id="compartilhar" hidden>Compartilhar o PDF</button>
  </div>
  <p id="anuncio" class="sr" aria-live="polite"></p>
</main>
<footer>Desenvolvido por <a href="https://github.com/mcoutinhof">Mateus Coutinho</a></footer>
<script type="module" src="./app.js"></script>
</body>
</html>
